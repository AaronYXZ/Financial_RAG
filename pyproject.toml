[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-eval"
version = "0.1.0"
description = "A small, reproducible retrieval evaluation harness for BEIR datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dense = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
